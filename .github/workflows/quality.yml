name: TechStar source quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-public-site:
    name: Validate public website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate inline JavaScript and public assets
        run: node scripts/check-homepage.mjs
      - name: Test interactive routes and quote form
        run: node scripts/check-routes.mjs
      - name: Verify quote form to Cloudflare API contract
        run: node scripts/check-contact-contract.mjs
      - name: Test Cloudflare API contract (not deployed)
        run: |
          node --check backend/src/index.mjs
          node --test backend/test/*.test.mjs
      - name: Validate D1 SQLite migrations and audit transactions
        run: python backend/scripts/check-schema.py
      - name: Rehearse CRM backup recovery on synthetic SQLite data
        run: python backend/scripts/check-backup-restore.py
      - name: Inspect Cloudflare staging configuration before release
        run: python backend/scripts/check-staging.py
      - name: Test isolated Cloudflare staging config with fake account values
        env:
          TECHSTAR_STAGING_D1_ID: "00000000-0000-0000-0000-000000000001"
          TECHSTAR_STAGING_RATE_NAMESPACE: "321890"
        run: |
          python backend/scripts/prepare-staging.py
          python backend/scripts/check-staging.py --require-ready --config backend/.wrangler-staging.toml
          grep -Fxq 'LEAD_INGESTION_ENABLED = "false"' backend/.wrangler-staging.toml
      - name: Validate private font preparation script
        run: python -m py_compile scripts/prepare-licensed-din-webfonts.py scripts/activate-licensed-din-webfonts.py
      - name: Verify font binaries are excluded from Git
        run: |
          grep -Fxq '*.woff2' .gitignore
          grep -Fxq '*.ttf' .gitignore
          grep -Fxq '.private-font-secrets/' .gitignore
      - name: Validate no sensitive backend files are published
        run: |
          test -f index.html
          test -f assets/techstar-icon.svg
          test ! -f .env
          test ! -f backend/.dev.vars
          test ! -f secrets.json
      - name: Validate default landing page and redirects
        run: |
          grep -qi '<!doctype html>' index.html
          grep -q 'id="app"' index.html
          grep -q 'techstar-erp/#/' 404.html
