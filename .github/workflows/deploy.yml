name: Deploy TechStar website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate website
        run: |
          test -s index.html
          grep -qi '<!doctype html>' index.html
          grep -q 'id="app"' index.html
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all six packages and JavaScript
        run: node scripts/check-homepage.mjs
      - name: Prepare artifact
        run: |
          mkdir -p _site/assets
          cp index.html 404.html robots.txt sitemap.xml site.webmanifest _site/
          cp assets/techstar-icon.svg _site/assets/
          touch _site/.nojekyll
          printf '{"commit":"%s","branch":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > _site/deployment.json
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Checking deployed homepage at ${SITE_URL}"
          for attempt in $(seq 1 8); do
            if curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}" -o /tmp/techstar-live.html \
              && grep -q 'id="app"' /tmp/techstar-live.html \
              && grep -q 'home-package-search' /tmp/techstar-live.html \
              && curl --fail --silent --show-error --location --max-time 15 "${SITE_URL%/}/deployment.json" -o /tmp/techstar-release.json \
              && grep -Fq "\"commit\":\"${GITHUB_SHA}\"" /tmp/techstar-release.json; then
              echo "TechStar live homepage at the correct commit ${GITHUB_SHA} (attempt ${attempt})"
              exit 0
            fi
            echo "Site not ready on attempt ${attempt} of 8"
            sleep 12
          done
          echo "::error::GitHub Pages did not serve the latest TechStar homepage."
          exit 1
