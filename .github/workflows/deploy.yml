name: Deploy TechStar website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate website
        run: |
          test -s index.html
          grep -qi '<!doctype html>' index.html
          grep -q 'id="app"' index.html
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all six packages and JavaScript
        run: node scripts/check-homepage.mjs
      - name: Test interactive routes and quote form
        run: node scripts/check-routes.mjs
      - name: Verify quote form to Cloudflare API contract
        run: node scripts/check-contact-contract.mjs
      - name: Test Cloudflare API contract (not deployed)
        run: |
          node --check backend/src/index.mjs
          node --test backend/test/*.test.mjs
      - name: Validate D1 SQLite migrations and audit transactions
        run: python backend/scripts/check-schema.py
      - name: Verify CRM backup and restoration before publishing
        run: python backend/scripts/check-backup-restore.py
      - name: Inspect Cloudflare staging configuration before release
        run: python backend/scripts/check-staging.py
      - name: Test isolated Cloudflare staging config with fake account values
        env:
          TECHSTAR_STAGING_D1_ID: "00000000-0000-0000-0000-000000000001"
          TECHSTAR_STAGING_RATE_NAMESPACE: "321890"
        run: |
          python backend/scripts/prepare-staging.py
          python backend/scripts/check-staging.py --require-ready --config backend/.wrangler-staging.toml
          grep -Fxq 'LEAD_INGESTION_ENABLED = "false"' backend/.wrangler-staging.toml
      - name: Prepare artifact
        run: |
          mkdir -p _site/assets _site/restaurant-control-preview _site/print-monitor-preview
          cp index.html 404.html robots.txt sitemap.xml site.webmanifest _site/
          test -s restaurant-control-preview/index.html
          test -s restaurant-control-preview/quality-dashboard.svg
          cp restaurant-control-preview/index.html restaurant-control-preview/quality-dashboard.svg _site/restaurant-control-preview/
          test -s print-monitor-preview/index.html
          grep -q 'بيئة عرض مستقلة' print-monitor-preview/index.html
          cp print-monitor-preview/index.html _site/print-monitor-preview/
          cp assets/techstar-icon.svg assets/din-next-arabic.css _site/assets/
          touch _site/.nojekyll
          printf '{"commit":"%s","branch":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" > _site/deployment.json
      - name: Embed licensed DIN Next Arabic Webfonts when configured
        shell: bash
        env:
          DIN_REGULAR_B64: ${{ secrets.TECHSTAR_DIN_REGULAR_WOFF2_B64 }}
          DIN_MEDIUM_B64: ${{ secrets.TECHSTAR_DIN_MEDIUM_WOFF2_B64 }}
          DIN_BOLD_B64: ${{ secrets.TECHSTAR_DIN_BOLD_WOFF2_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$DIN_REGULAR_B64" || -z "$DIN_MEDIUM_B64" || -z "$DIN_BOLD_B64" ]]; then
            echo "Licensed DIN Next Webfont secrets not configured; using installed fonts and fallback."
            exit 0
          fi
          printf '%s' "$DIN_REGULAR_B64" | base64 --decode > _site/assets/din-next-regular.woff2
          printf '%s' "$DIN_MEDIUM_B64" | base64 --decode > _site/assets/din-next-medium.woff2
          printf '%s' "$DIN_BOLD_B64" | base64 --decode > _site/assets/din-next-bold.woff2
          for font in _site/assets/din-next-{regular,medium,bold}.woff2; do
            test -s "$font"
            if [[ "$(head -c 4 "$font")" != "wOF2" ]]; then
              echo "::error::Invalid WOFF2 data in a licensed font secret."
              exit 1
            fi
          done
          cat >> _site/assets/din-next-arabic.css <<'FONT_CSS'
          /* Licensed Webfonts are injected at deploy time; font binaries are not in Git. */
          @font-face {
            font-family: 'TechStar DIN Next Arabic';
            src: url('./din-next-regular.woff2') format('woff2');
            font-style: normal;
            font-weight: 400;
            font-display: swap;
          }
          @font-face {
            font-family: 'TechStar DIN Next Arabic';
            src: url('./din-next-medium.woff2') format('woff2');
            font-style: normal;
            font-weight: 500;
            font-display: swap;
          }
          @font-face {
            font-family: 'TechStar DIN Next Arabic';
            src: url('./din-next-bold.woff2') format('woff2');
            font-style: normal;
            font-weight: 700 900;
            font-display: swap;
          }
          FONT_CSS
          echo "Licensed DIN Next Webfonts embedded in the Pages artifact."
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait until GitHub has indexed the Pages artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)
            if [[ "$count" =~ ^[1-9][0-9]*$ ]]; then
              echo "GitHub Pages artifact indexed on attempt ${attempt}"
              sleep 3
              exit 0
            fi
            echo "Artifact indexing pending (${attempt}/12)"
            sleep 5
          done
          echo "::error::Pages artifact was uploaded but was not yet visible through the Actions API."
          exit 1
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published homepage
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          echo "Checking deployed homepage at ${SITE_URL}"
          for attempt in $(seq 1 8); do
            if curl --fail --silent --show-error --location --max-time 15 "${SITE_URL}" -o /tmp/techstar-live.html \
              && grep -q 'id="app"' /tmp/techstar-live.html \
              && grep -q 'home-package-search' /tmp/techstar-live.html \
              && curl --fail --silent --show-error --location --max-time 15 "${SITE_URL%/}/deployment.json" -o /tmp/techstar-release.json \
              && grep -Fq "\"commit\":\"${GITHUB_SHA}\"" /tmp/techstar-release.json; then
              echo "TechStar live homepage at the correct commit ${GITHUB_SHA} (attempt ${attempt})"
              exit 0
            fi
            echo "Site not ready on attempt ${attempt} of 8"
            sleep 12
          done
          echo "::error::GitHub Pages did not serve the latest TechStar homepage."
          exit 1
      - name: Verify independently published restaurant-quality preview
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          for attempt in $(seq 1 8); do
            if curl --fail --silent --show-error --location --max-time 15 "${SITE_URL%/}/restaurant-control-preview/" -o /tmp/restaurant-quality-preview.html \
              && grep -q 'واجهة استعراضية ثابتة' /tmp/restaurant-quality-preview.html \
              && grep -q 'لا تتصل بقاعدة بيانات' /tmp/restaurant-quality-preview.html; then
              echo "Standalone quality preview verified on published GitHub Pages"
              exit 0
            fi
            echo "Restaurant quality preview not available yet ($attempt/8)"
            sleep 12
          done
          echo "::error::Restaurant quality preview was not published"
          exit 1

      - name: Verify published print monitoring demo
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            if curl --fail --silent --show-error --location --max-time 15 "${SITE_URL%/}/print-monitor-preview/" -o /tmp/print-monitor-preview.html \
              && grep -q 'مركز مراقبة الطباعة' /tmp/print-monitor-preview.html \
              && grep -q 'بيئة عرض مستقلة' /tmp/print-monitor-preview.html; then
              echo "Odoo print monitoring demo is published (mock data only)"
              exit 0
            fi
            sleep 12
          done
          echo "::error::Print monitoring demo was not published"
          exit 1
