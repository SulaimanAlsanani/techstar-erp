name: TechStar Cloudflare staging (manual only)

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending migrations to the dedicated STAGING D1 database"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: techstar-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TECHSTAR_STAGING_D1_ID: ${{ vars.TECHSTAR_STAGING_D1_ID }}
      TECHSTAR_STAGING_RATE_NAMESPACE: ${{ vars.TECHSTAR_STAGING_RATE_NAMESPACE }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate existing app and CRM safeguards
        run: |
          node --check src/index.mjs
          node --test test/*.test.mjs
          python scripts/check-schema.py
      - name: Reject missing Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing Cloudflare staging API token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing Cloudflare staging account ID"; exit 1; }
      - name: Generate isolated staging-only config
        run: python scripts/prepare-staging.py
      - name: Verify public lead collection is disabled
        run: |
          python scripts/check-staging.py --config .wrangler-staging.toml --require-ready
          grep -Fqx 'LEAD_INGESTION_ENABLED = "false"' .wrangler-staging.toml
          grep -Fqx 'name = "techstar-public-api-staging"' .wrangler-staging.toml
      - name: Install pinned project tooling
        run: npm install --no-audit --no-fund
      - name: List outstanding staging D1 migrations
        run: npx wrangler d1 migrations list techstar-leads-staging --remote --config .wrangler-staging.toml
      - name: Apply staging D1 migrations only when explicitly requested
        if: ${{ inputs.apply_migrations == true }}
        run: npx wrangler d1 migrations apply techstar-leads-staging --remote --config .wrangler-staging.toml
      - name: Deploy staging Worker (no production site changes)
        run: npx wrangler deploy --config .wrangler-staging.toml
      - name: Show safe release summary
        run: |
          echo "Staging Worker: techstar-public-api-staging"
          echo "Public lead collection: disabled"
          echo "GitHub Pages frontend: unchanged"
          echo "Set Access, Turnstile, retention and CRM secrets through Cloudflare before using real data."
