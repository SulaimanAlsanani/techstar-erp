function pageHead(eyebrow,title,description){return `<div class="page-hero"><div class="container"><div class="crumb">${link('/','الرئيسية')} / ${esc(eyebrow)}</div><h1>${esc(title)}</h1><p>${esc(description)}</p></div></div>`}
function heading(k,t,d,center=false){return `<div class="section-head ${center?'center':''}"><div class="eyebrow">${esc(k)}</div><h2>${esc(t)}</h2><p>${esc(d)}</p></div>`}
function normalizeSearch(text){
  return String(text??'').toLocaleLowerCase('ar').normalize('NFKC')
    .replace(/[\u064B-\u065F\u0670\u0640]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
    .replace(/\s+/g,' ').trim();
}
function packageSearchIndex(p){
  const aliases=p.apps.includes('التجارة الإلكترونية')
    ? ['المتجر الإلكتروني','متجر إلكتروني','ecommerce','online store'] : [];
  return normalizeSearch([p.name,p.tag,p.for,...p.apps,...aliases].join(' '));
}

function about(){const steps=[['01','تحليل النشاط','فهم طبيعة المتجر والفروع والأصناف والأجهزة والتحديات الحالية.'],['02','تحديد النطاق','اختيار التطبيقات والبيانات والصلاحيات والتكاملات والجدول التنفيذي.'],['03','التهيئة والاختبار','تجهيز البيئة وترحيل البيانات واختبار العمليات والحالات الفعلية.'],['04','التدريب والإطلاق','تدريب الفرق واختبار الجاهزية والانتقال إلى التشغيل والدعم المتفق عليه.']];return pageHead('منهجية العمل','من دراسة الاحتياج إلى التشغيل','اعتماد مراحل واضحة يقلل مخاطر الانتقال ويجعل نتائج التنفيذ قابلة للتحقق.')+`<section class="section"><div class="container">${heading('طريقة العمل','تنفيذ منظم وليس تركيب برنامج فقط','تحديد النطاق والبيانات والأجهزة والمتطلبات قبل بدء التهيئة.') }<div class="grid grid-4">${steps.map(([n,t,d])=>`<article class="step-card"><div class="step-num">${n}</div><h3>${t}</h3><p>${d}</p></article>`).join('')}</div></div></section><section class="section section-alt"><div class="container grid grid-2"><div class="theme-card"><h3>ما الذي يحدد تكلفة المشروع؟</h3><p>التأسيس والتهيئة · عدد التطبيقات · المستخدمون · نقاط البيع · الفروع · حجم العمليات · الاستضافة · التدريب · الدعم الفني · التكاملات.</p></div><div class="theme-card"><h3>ما الذي يحتاج تحققًا مسبقًا؟</h3><p>الأجهزة والطابعات والدفع الإلكتروني والفوترة الإلكترونية وربط التوصيل وWhatsApp وسياسات الخصوصية ومتطلبات الامتثال.</p></div></div></section><section class="section"><div class="container">${heading('أسئلة متكررة','معلومات تساعدك قبل الطلب','إجابات أولية؛ التفاصيل النهائية تتحدد وفق الاتفاق.') }<div class="grid grid-2">${[['هل يمكن البدء بباقة ثم التوسع؟','نعم، يحدد نطاق التطبيقات والتوسعة بحسب حجم النشاط والمتطلبات الفنية والترخيص.'],['هل الأسعار ثابتة؟','لا، العروض مخصصة وفق التطبيقات والمستخدمين والفروع وأجهزة البيع والتكاملات والدعم.'],['هل المتجر الإلكتروني متصل بالمخزون؟','يمكن ربط المنتجات والطلبات والمخزون والمحاسبة حسب التهيئة والتكاملات المعتمدة.'],['هل الربط مع الطابعات والدفع مضمون؟','لا يُعتمد أي ربط إلا بعد التأكد من توافق الأجهزة ومزود الخدمة واختبار العمليات.']].map(([q,a])=>`<details class="faq-item"><summary>${q}</summary><p>${a}</p></details>`).join('')}</div></div></section>`}
function getParams(){const q=route().split('?')[1]||'';return new URLSearchParams(q)}
function contact(){const p=getParams(),selected=bundles.find(x=>x.id===p.get('package')),solution=solutions.find(x=>x.id===p.get('solution'));return pageHead('تواصل معنا','اطلب عرضًا فنيًا يناسب نشاطك','أدخل بيانات النشاط وسننشئ لك ملخص طلب احترافيًا تستطيع نسخه أو تنزيله ومشاركته مع فريق TechStar.')+`<section class="section"><div class="container grid contact-layout"><div class="contact-panel"><h2 style="margin-top:0">بيانات طلب العرض</h2><form id="quote-form"><div class="form-grid"><label class="field">اسم المسؤول <span class="required">*</span><input name="name" autocomplete="name" class="input" required maxlength="120" placeholder="الاسم الكامل"></label><label class="field">اسم المنشأة <span class="required">*</span><input name="business" class="input" required maxlength="140" placeholder="اسم المتجر أو الشركة"></label><label class="field">البريد الإلكتروني <span class="required">*</span><input name="email" type="email" autocomplete="email" class="input" required maxlength="140" placeholder="name@example.com"></label><label class="field">رقم الجوال <span class="required">*</span><input name="phone" type="tel" autocomplete="tel" class="input" required maxlength="30" placeholder="05xxxxxxxx"></label><label class="field">نوع النشاط<select name="industry"><option>سوبر ماركت</option><option>هايبر ماركت</option><option>بقالة</option><option>متجر تجزئة</option><option>أخرى</option></select></label><label class="field">الباقة المطلوبة<select name="package"><option value="">لم أحدد بعد</option>${bundles.map(b=>`<option value="${b.id}" ${selected?.id===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label><label class="field">عدد الفروع<input class="input" name="branches" type="number" min="1" max="10000" value="1" required></label><label class="field">عدد نقاط البيع<input class="input" name="pos" type="number" min="0" max="10000" value="1" required></label><label class="field full">الحل المطلوب (اختياري)<select name="solution"><option value="">عدة حلول أو لم أحدد بعد</option>${solutions.map(s=>`<option value="${s.id}" ${solution?.id===s.id?'selected':''}>${esc(s.title)}</option>`).join('')}</select></label><label class="field full">تفاصيل المتطلبات<textarea name="notes" maxlength="2000" placeholder="الأنظمة الحالية، عدد الموظفين، التكاملات والأجهزة المطلوبة…"></textarea><span class="hint">لا تدرج كلمات مرور أو معلومات مالية حساسة.</span></label></div><label class="honeypot" aria-hidden="true">موقع الشركة<input name="website" tabindex="-1" autocomplete="off"></label><div id="turnstile-slot" class="full"></div><div class="form-actions"><button class="btn btn-dark" type="submit" id="submit-quote">تجهيز الطلب / إرساله</button><button type="button" class="btn btn-outline" id="save-draft">حفظ مسودة لمدة 7 أيام</button><button type="reset" class="btn btn-outline" id="reset-form">مسح النموذج</button></div></form><div id="quote-result" aria-live="polite"></div></div><aside><div class="detail-aside"><h3>كيف يعمل الطلب؟</h3><p>يمكن ربط الموقع بخدمة استقبال آمنة. في حال عدم تفعيل الخدمة، يمكنك نسخ الطلب أو تنزيله.</p><p><strong>لا يُرسل الطلب إلا عند تفعيل خدمة الاستقبال وظهور تأكيد نجاح الإرسال</strong>؛ ربط نموذج استقبال فعلي يحتاج بريدًا مخصصًا أو خدمة خلفية آمنة.</p><p>الحفظ المحلي اختياري ويتم في متصفحك على هذا الجهاز فقط.</p></div></aside></div></section>`}
function notFound(){return pageHead('404','الصفحة غير موجودة','قد يكون الرابط غير صحيح أو تم تغيير عنوان الصفحة.')+`<section class="section"><div class="container">${link('/','العودة للرئيسية','btn btn-dark')}</div></section>`}
function showToast(message){const t=$('#toast');if(!t)return;t.textContent=message;t.classList.remove('hide');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.add('hide'),3500)}
function initPackageComparison(){
  const checkbox=$('#compare-differences-only'),count=$('#compare-rows-count');
  if(!checkbox||!count)return;
  const rows=[...document.querySelectorAll('.compare-table tbody tr')];
  const update=()=>{
    let visible=0;
    for(const row of rows){
      const show=!checkbox.checked||row.dataset.shared!=='true';
      row.hidden=!show;
      if(show)visible++;
    }
    count.textContent='عرض '+visible+' من '+rows.length+' تطبيقات';
  };
  checkbox.addEventListener('change',update);
  update();
}
function initHomePackageSearch(){
  const search=$('#home-package-search'),grid=$('#home-packages-grid');
  if(!search||!grid)return;
  const count=$('#home-package-count'),empty=$('#home-packages-empty');
  const cards=[...grid.querySelectorAll('.package-card')];
  const indexed=cards.map(card=>({
    card, text:packageSearchIndex(bundles.find(p=>p.id===card.dataset.packageId)||{name:'',tag:'',for:'',apps:[]})
  }));
  const update=()=>{
    const query=normalizeSearch(search.value);
    let visible=0;
    for(const item of indexed){
      const matches=!query||item.text.includes(query);
      item.card.hidden=!matches;
      if(matches)visible++;
    }
    count.textContent='عرض '+visible+' من '+bundles.length+' باقات';
    empty.classList.toggle('hide',visible!==0);
  };
  search.addEventListener('input',update);
  update();
}
function initSolutions(){const input=$('#solution-search'),results=$('#solutions-results');if(!input)return;let current='الكل';function update(){const q=normalizeSearch(input.value);const shown=solutions.filter(s=>(current==='الكل'||s.group===current)&&normalizeSearch(`${s.title} ${s.intro} ${s.group} ${s.features.join(' ')}`).includes(q));results.innerHTML=shown.map(solutionCard).join('');$('#solutions-empty').classList.toggle('hide',shown.length!==0)}input.addEventListener('input',update);$('#solution-filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;current=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));update()})}
function summary(data){const p=bundles.find(b=>b.id===data.package),s=solutions.find(x=>x.id===data.solution);return `طلب عرض فني — TechStar\n\nاسم المسؤول: ${data.name}\nالمنشأة: ${data.business}\nالبريد الإلكتروني: ${data.email}\nالجوال: ${data.phone}\nنوع النشاط: ${data.industry}\nالباقة: ${p?.name||'لم تحدد'}\nالحل: ${s?.title||'عدة حلول / غير محدد'}\nعدد الفروع: ${data.branches}\nعدد نقاط البيع: ${data.pos}\nالمتطلبات: ${data.notes||'لم تذكر'}\n\nملاحظة: هذه مسودة طلب تم إنشاؤها في المتصفح، ولم تُرسل إلى TechStar تلقائيًا.`}
function draftData(form){return Object.fromEntries(new FormData(form).entries())}
const DRAFT_MAX_AGE=7*24*60*60*1000;
function loadQuoteDraft(){
  const stored=JSON.parse(localStorage.getItem('techstar_quote_draft')||'null');
  if(!stored||typeof stored!=='object'||Array.isArray(stored))return null;
  if(stored.version===2){
    if(!stored.fields||typeof stored.fields!=='object'||Array.isArray(stored.fields)||
       !Number.isFinite(stored.savedAt)||stored.savedAt>Date.now()||
       Date.now()-stored.savedAt>DRAFT_MAX_AGE){
      localStorage.removeItem('techstar_quote_draft');
      return null;
    }
    return stored.fields;
  }
  // Migrate an older manually saved draft into the expiring format.
  localStorage.setItem('techstar_quote_draft',JSON.stringify({version:2,savedAt:Date.now(),fields:stored}));
  return stored;
}
function saveQuoteDraft(form){
  localStorage.setItem('techstar_quote_draft',JSON.stringify({version:2,savedAt:Date.now(),fields:draftData(form)}));
}
function apiBase(){return String(window.TECHSTAR_CONFIG?.apiBaseUrl||'').replace(/\/$/,'')}
function turnstileKey(){return String(window.TECHSTAR_CONFIG?.turnstileSiteKey||'')}
let turnstileWidget=null;
function initTurnstile(){const slot=$('#turnstile-slot');if(!slot||!apiBase()||!turnstileKey())return;const show=()=>{if(!window.turnstile||!document.contains(slot))return;turnstileWidget=window.turnstile.render(slot,{sitekey:turnstileKey()})};if(window.turnstile)show();else{const script=document.createElement('script');script.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';script.async=true;script.onload=show;document.head.appendChild(script)}}
function initContact(){const f=$('#quote-form');if(!f)return;let submissionId=null;f.addEventListener('input',()=>{submissionId=null});f.addEventListener('reset',()=>{submissionId=null});initTurnstile();const sendBtn=$('#submit-quote');sendBtn.textContent=apiBase()?'إرسال طلب العرض':'تجهيز ملخص الطلب';try{const draft=loadQuoteDraft();if(draft&&typeof draft==='object'){for(const [k,v]of Object.entries(draft)){if(f.elements.namedItem(k)&&!getParams().get(k))f.elements.namedItem(k).value=v}showToast('تم استعادة المسودة المحلية')}}catch{}$('#save-draft').addEventListener('click',()=>{try{saveQuoteDraft(f);showToast('حُفظت المسودة لمدة 7 أيام على هذا الجهاز')}catch{showToast('تعذر الحفظ المحلي')}});$('#reset-form').addEventListener('click',()=>{try{localStorage.removeItem('techstar_quote_draft')}catch{};$('#quote-result').innerHTML='';showToast('تم مسح المسودة')});f.addEventListener('submit',async e=>{e.preventDefault();if(!f.reportValidity())return;const data=draftData(f);const txt=summary(data);
if(apiBase()){
 sendBtn.disabled=true;sendBtn.textContent='جارٍ إرسال الطلب…';
 try{if(!submissionId&&window.crypto?.randomUUID)submissionId=window.crypto.randomUUID();const payload={...data};if(submissionId)payload.requestId=submissionId;if(turnstileKey()&&window.turnstile&&turnstileWidget!==null)payload.turnstileToken=window.turnstile.getResponse(turnstileWidget);
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);
 let response;try{response=await fetch(apiBase()+'/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal})}finally{clearTimeout(timer)}
 const result=await response.json().catch(()=>({}));
 if(!response.ok||!result.received||!result.reference)throw Error(response.status===429?'تم تجاوز عدد المحاولات. حاول لاحقًا.':response.status===422?'تحقق من بيانات الطلب أو اختبار الحماية.':'تعذّر إرسال الطلب. لم يتم تأكيد استلامه.');
 $('#quote-result').innerHTML=`<div class="success"><h3>✓ تم استلام طلبك بنجاح</h3><p>رقم المرجع: <strong dir="ltr">${esc(result.reference)}</strong></p><p>احتفظ برقم المرجع للمتابعة.</p></div>`;
 try{localStorage.removeItem('techstar_quote_draft')}catch{};
 f.reset();submissionId=null;$('#quote-result').scrollIntoView({behavior:'smooth',block:'nearest'});return;
 }catch(error){$('#quote-result').innerHTML=`<div class="note" role="alert">${esc(error.message||'تعذّر الاتصال بالخادم. لم يتم تأكيد إرسال الطلب.')}</div>`;if(window.turnstile&&turnstileWidget!==null)window.turnstile.reset(turnstileWidget)}finally{sendBtn.disabled=false;sendBtn.textContent='إرسال طلب العرض'}
 return;
}
$('#quote-result').innerHTML=`<div class="success"><h3>✓ ملخص الطلب جاهز</h3><p>انسخه أو نزّله ثم أرسله عبر قناة التواصل الرسمية. لم يُرسل تلقائيًا.</p><div class="summary-pre" id="summary-output">${esc(txt)}</div><div class="form-actions"><button type="button" class="btn btn-dark" id="copy-summary">نسخ الملخص</button><button type="button" class="btn btn-outline" id="download-summary">تنزيل TXT</button></div></div>`;$('#copy-summary').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(txt);showToast('تم نسخ ملخص الطلب')}catch{showToast('تعذر النسخ؛ يمكنك تحديد الملخص ونسخه يدويًا')}});$('#download-summary').addEventListener('click',()=>{const blob=new Blob(['\uFEFF'+txt],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='TechStar-Request.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)});$('#quote-result').scrollIntoView({behavior:'smooth',block:'nearest'})})}
function render(){const path=route().split('?')[0];let content=path==='/'?home():path==='/solutions'?solutionsPage():path.startsWith('/solution/')?solutionDetail(path.split('/')[2]):path==='/packages'?packagesPage():path==='/about'?about():path==='/contact'?contact():notFound();$('#app').innerHTML=layout(content);document.title=(path==='/'?'الرئيسية':path==='/packages'?'الباقات':path==='/solutions'?'الحلول':path==='/about'?'منهجية العمل':path==='/contact'?'طلب عرض فني':path.startsWith('/solution/')?solutions.find(s=>s.id===path.split('/')[2])?.title||'غير موجود':'غير موجود')+' | TechStar';const menu=$('.mobile-toggle');menu.addEventListener('click',()=>{const n=$('#nav');const open=n.classList.toggle('open');menu.setAttribute('aria-expanded',String(open))});$('#nav').addEventListener('click',e=>{if(e.target.closest('a')){$('#nav').classList.remove('open');menu.setAttribute('aria-expanded','false')}});const browse=$('#browse-home-packages');if(browse)browse.addEventListener('click',()=>$('#home-packages-section')?.scrollIntoView({behavior:'smooth',block:'start'}));initHomePackageSearch();initPackageComparison();initSolutions();initContact();window.scrollTo({top:0,behavior:'instant'})}
// Dynamic catalogue is optional: the bundled catalogue remains readable when API is unavailable.
async function refreshCatalogue(){
 if(!apiBase())return;
 try{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5000);
  let response;try{response=await fetch(apiBase()+'/api/content',{signal:controller.signal,cache:'no-store'})}finally{clearTimeout(timer)}
  if(!response.ok)return;
  const json=await response.json();if(!Array.isArray(json.items))return;
  let changed=false;
  for(const item of json.items){
   const list=item.kind==='solution'?solutions:item.kind==='package'?bundles:null;
   const model=list?.find(x=>x.id===item.id);
   if(!model||!item.data||typeof item.data!=='object'||Array.isArray(item.data))continue;
   const fields=item.kind==='solution'?['title','intro','group','icon','note','features']:['name','tag','for','apps'];
   for(const key of fields){const value=item.data[key];if(typeof value==='string' || (Array.isArray(value) && value.every(v=>typeof v==='string'))){model[key]=value;changed=true;}}
  }
  // Avoid resetting a user's in-progress contact form.
  if(changed && route().split('?')[0]!=='/contact')render();
 }catch{/* Offline fallback is intentionally silent. */}
}
window.addEventListener('hashchange',()=>{render();document.getElementById('main')?.focus({preventScroll:true})});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;const nav=document.getElementById('nav'),toggle=document.querySelector('.mobile-toggle');if(nav?.classList.contains('open')){nav.classList.remove('open');toggle?.setAttribute('aria-expanded','false');toggle?.focus()}});
document.addEventListener('DOMContentLoaded',()=>{const skip=$('#skip-to-content');if(skip)skip.addEventListener('click',()=>{const main=$('#main');if(main){main.focus();main.scrollIntoView({block:'start',behavior:'smooth'})}});render();refreshCatalogue()});
