name = "techstar-public-api"
main = "src/index.mjs"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://sulaimanalsanani.github.io"
TURNSTILE_HOSTNAME = "sulaimanalsanani.github.io"

# Replace the D1 database id after creating the actual Cloudflare D1 database.
# Never add TURNSTILE_SECRET or other secrets to this file.
[[d1_databases]]
binding = "DB"
database_name = "techstar-leads"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"
