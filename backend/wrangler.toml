name = "techstar-public-api"
main = "src/index.mjs"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://sulaimanalsanani.github.io"
TURNSTILE_HOSTNAME = "sulaimanalsanani.github.io"

# Replace the D1 database id after creating the actual Cloudflare D1 database.
# Never add TURNSTILE_SECRET or other secrets to this file.
[[d1_databases]]
binding = "DB"
database_name = "techstar-leads"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Public quote anti-abuse: 6 submissions/minute per client IP, approximately,
# within each Cloudflare location. Choose an integer namespace ID unique to
# this Cloudflare account before deployment.
[[ratelimits]]
name = "LEAD_RATE_LIMITER"
namespace_id = "REPLACE_WITH_UNIQUE_INTEGER_NAMESPACE_ID"
  [ratelimits.simple]
  limit = 6
  period = 60
